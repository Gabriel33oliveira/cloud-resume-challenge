name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::033193124956:role/github-actions-deploy-portfolio
          aws-region: us-east-1

      - name: Upload site files to S3
        run: |
          aws s3 cp index.html s3://gabriel-luz-portifolio/index.html
          aws s3 cp styles.css s3://gabriel-luz-portifolio/styles.css
          aws s3 cp script.js s3://gabriel-luz-portifolio/script.js
          aws s3 cp universe.js s3://gabriel-luz-portifolio/universe.js

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3GSVK2B697MKW \
            --paths "/*"
